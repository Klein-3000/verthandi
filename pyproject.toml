[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verthandi"
# 版本号唯一来源是 app/__init__.py 的 __version__，此处自动读取，勿手写
dynamic = ["version"]
description = "Hoshimi 服务端的桌面控制台，提供图形化启停、切服、初始化与资源管理"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
    "psutil>=7.2.2",
    "pycryptodome>=4.2.0",
    "pyside6>=6.12.0",
    "pyside6-fluent-widgets>=1.11.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff.lint]
ignore = [
    "DTZ005", "DTZ006", # 忽略本地时间未带时区的问题（桌面端单机使用，无需严格时区）
    "BLE001",           # 忽略 `except Exception:`（GUI 应用必须用大网兜底，防止程序闪退）
    "S110", "S112",     # 忽略 `try-except-pass` 或 `continue`（常见于探测和清理逻辑）
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pyinstaller>=6.22.3",
]
